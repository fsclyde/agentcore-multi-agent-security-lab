# Kubernetes side of the tool permissions. The groups come from the EKS access
# entries of the two tool Lambdas (infra/eks.tf).

# Read tools: read workloads, events and logs in demo. No Secrets, no exec.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentcore-read
  namespace: demo
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentcore-read
  namespace: demo
subjects:
  - kind: Group
    name: agentcore-k8s-read
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: agentcore-read
  apiGroup: rbac.authorization.k8s.io
---
# Write tool: read and patch Deployments in demo. Nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentcore-write
  namespace: demo
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentcore-write
  namespace: demo
subjects:
  - kind: Group
    name: agentcore-k8s-write
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: agentcore-write
  apiGroup: rbac.authorization.k8s.io
