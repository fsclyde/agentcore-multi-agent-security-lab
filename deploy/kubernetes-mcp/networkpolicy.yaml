# The MCP server only receives traffic on its MCP port, and only reaches the
# Kubernetes API and DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubernetes-mcp-read
  namespace: mcp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: kubernetes-mcp-read
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
  egress:
    - ports:
        - port: 443
          protocol: TCP
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
